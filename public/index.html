<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniTech Support - Web Viewer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#e6f4ff',
              500: '#0078d4',
              600: '#0063b1',
              700: '#004e8c'
            },
            dark: {
              900: '#090d16',
              800: '#111827',
              700: '#1f293d',
              600: '#334155'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090d16; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glass-card { background: rgba(31, 41, 61, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-blue { box-shadow: 0 0 25px -5px rgba(0, 120, 212, 0.4); }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = window.location.origin;

    function formatImageSrc(imgStr) {
      if (!imgStr) return '';
      if (imgStr.startsWith('data:')) return imgStr;
      return 'data:image/jpeg;base64,' + imgStr;
    }

    function formatDate(dateVal) {
      if (!dateVal) return new Date().toLocaleTimeString();
      if (typeof dateVal === 'string' && dateVal.includes('/Date(')) {
        const timeMatch = dateVal.match(/\/Date\((\d+)\)\//);
        if (timeMatch) return new Date(parseInt(timeMatch[1])).toLocaleTimeString();
      }
      const d = new Date(dateVal);
      return isNaN(d.getTime()) ? new Date().toLocaleTimeString() : d.toLocaleTimeString();
    }

    function App() {
      const [screenshots, setScreenshots] = useState([]);
      const [chatMessages, setChatMessages] = useState([]);
      const [activeSupportKey, setActiveSupportKey] = useState('');
      const [selectedShot, setSelectedShot] = useState(null);
      const [chatInputText, setChatInputText] = useState('');

      const chatEndRef = useRef(null);

      const fetchScreenshots = async (keyFilter) => {
        try {
          const url = keyFilter ? `${API_BASE}/api/session/screenshots?key=${encodeURIComponent(keyFilter)}` : `${API_BASE}/api/session/screenshots`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) {
              setScreenshots(data);
              if (data.length > 0) {
                // Auto select newest shot
                setSelectedShot(data[0]);
              }
            }
          }
        } catch(e){}
      };

      const fetchChatMessages = async (keyFilter) => {
        try {
          const url = keyFilter ? `${API_BASE}/api/chat/messages?key=${encodeURIComponent(keyFilter)}` : `${API_BASE}/api/chat/messages`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) setChatMessages(data);
          }
        } catch(e){}
      };

      useEffect(() => {
        fetchScreenshots(activeSupportKey);
        fetchChatMessages(activeSupportKey);

        const timer = setInterval(() => {
          fetchScreenshots(activeSupportKey);
          fetchChatMessages(activeSupportKey);
        }, 2000);

        return () => clearInterval(timer);
      }, [activeSupportKey]);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages]);

      const handleSendSupportChat = async (textToSend) => {
        const messageText = textToSend || chatInputText;
        if (!messageText.trim()) return;

        const targetKey = selectedShot ? selectedShot.key : (activeSupportKey || '');
        try {
          await fetch(`${API_BASE}/api/chat/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: targetKey, sender: 'Support', text: messageText })
          });
          setChatInputText('');
          fetchChatMessages(activeSupportKey);
        } catch(e){}
      };

      const handleDownloadZip = async () => {
        if (screenshots.length === 0) {
          alert("Chưa có ảnh nào để tải về.");
          return;
        }

        const zip = new JSZip();
        const imgFolder = zip.folder(`Support_Screenshots_${activeSupportKey || 'Session'}`);
        const ordered = [...screenshots].reverse();

        ordered.forEach((s, idx) => {
          let base64Data = s.imageBase64 || '';
          if (base64Data.includes(',')) {
            base64Data = base64Data.split(',')[1];
          }
          if (base64Data) {
            imgFolder.file(`Anh_${idx + 1}.jpg`, base64Data, { base64: true });
          }
        });

        const content = await zip.generateAsync({ type: 'blob' });
        saveAs(content, `MiniTech_Photos_${activeSupportKey || 'All'}.zip`);
      };

      const getScreenshotLabel = (shot) => {
        if (!shot) return 'Ảnh #1';
        const ordered = [...screenshots].reverse();
        const idx = ordered.findIndex(s => s.id === shot.id);
        return `Ảnh #${idx !== -1 ? idx + 1 : 1}`;
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="glass sticky top-0 z-50 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-blue-400 flex items-center justify-center font-bold text-white shadow-lg glow-blue text-xl">
                M
              </div>
              <div>
                <h1 className="font-bold text-lg text-white tracking-wide">MiniTech Support Viewer</h1>
                <p className="text-xs text-gray-400">Trang Hỗ Trợ Kỹ Thuật Từ Xa Realtime (Tự Động Nhận Ảnh Mới)</p>
              </div>
            </div>

            <div className="flex items-center space-x-4">
              <a 
                href="/admin.html" 
                target="_blank"
                className="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-dark-800 text-gray-400 hover:text-white border border-gray-700 transition flex items-center space-x-1.5">
                <span>🔒 Đăng Nhập Admin Key</span>
              </a>
            </div>
          </header>

          {/* Main Area */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">

            {/* Filter Bar */}
            <div className="glass-card p-4 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <span className="text-sm font-bold text-white">Lọc Theo Mã Key:</span>
                <input 
                  type="text" 
                  placeholder="Để trống xem tất cả ảnh..."
                  value={activeSupportKey} 
                  onChange={e => setActiveSupportKey(e.target.value.toUpperCase())}
                  className="bg-dark-900 border border-gray-700 font-mono font-bold text-blue-400 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-brand-500 w-64"
                />
                <button 
                  onClick={() => { fetchScreenshots(activeSupportKey); fetchChatMessages(activeSupportKey); }}
                  className="px-4 py-2 bg-brand-600 text-white rounded-lg text-xs font-semibold hover:bg-brand-700 shadow">
                  Tải Dữ Liệu
                </button>
              </div>
              
              <div className="flex items-center space-x-3">
                <button 
                  onClick={handleDownloadZip}
                  className="px-4 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xs rounded-xl shadow-lg flex items-center space-x-2 transition">
                  <span>📦 TẢI FILE ZIP TẤT CẢ ÁNH ({screenshots.length})</span>
                </button>
                <div className="flex items-center space-x-2 text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-lg border border-emerald-500/20">
                  <span className="relative flex h-2.5 w-2.5">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                  </span>
                  <span className="font-semibold">Tự Động Cập Nhật (2s)</span>
                </div>
              </div>
            </div>

            {/* Viewer Workspace */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* Left Thumbnails List */}
              <div className="lg:col-span-4 glass-card p-4 rounded-2xl border border-gray-800 space-y-3 max-h-[700px] overflow-y-auto">
                <h3 className="text-xs uppercase font-bold text-gray-400 tracking-wider mb-2">
                  Danh Sách Ảnh Chụp ({screenshots.length})
                </h3>

                {screenshots.length === 0 ? (
                  <div className="text-center py-12 space-y-2 text-gray-500">
                    <div className="text-3xl">📷</div>
                    <p className="text-xs font-semibold">Chưa có ảnh nào được tải lên.</p>
                    <p className="text-[11px] text-gray-600">Bấm 📸 Gửi Ảnh trên tool client để gửi ảnh mới.</p>
                  </div>
                ) : (
                  screenshots.map((shot) => {
                    const isSelected = selectedShot && selectedShot.id === shot.id;
                    return (
                      <div 
                        key={shot.id}
                        onClick={() => setSelectedShot(shot)}
                        className={`p-3 rounded-xl cursor-pointer transition border flex items-center space-x-3 ${isSelected ? 'bg-brand-500/20 border-brand-500 glow-blue' : 'bg-dark-900/60 border-gray-800 hover:border-gray-700'}`}>
                        <img 
                          src={formatImageSrc(shot.imageBase64)} 
                          alt="Thumbnail" 
                          className="w-16 h-12 object-cover rounded-lg border border-gray-700"
                        />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-xs text-white">{getScreenshotLabel(shot)}</span>
                            <span className="text-[10px] text-gray-400 font-mono">{formatDate(shot.capturedAt)}</span>
                          </div>
                          <p className="text-[11px] font-mono font-bold text-blue-400 truncate mt-0.5">{shot.key}</p>
                          <p className="text-[10px] text-gray-500 truncate mt-0.5">💻 {shot.machineName || 'ClientPC'}</p>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {/* Right Big Viewer & 2-Way Chat */}
              <div className="lg:col-span-8 space-y-6">
                
                {/* Big Image Card */}
                <div className="glass-card p-5 rounded-2xl border border-gray-800 space-y-4">
                  {selectedShot ? (
                    <div>
                      <div className="flex items-center justify-between pb-3 border-b border-gray-800/80">
                        <div>
                          <h2 className="text-base font-bold text-white flex items-center space-x-2">
                            <span>{getScreenshotLabel(selectedShot)}</span>
                            <span className="text-xs font-mono font-normal text-blue-400">({selectedShot.key})</span>
                          </h2>
                          <p className="text-xs text-gray-400 mt-0.5">
                            Máy: <span className="text-purple-300 font-mono font-semibold">{selectedShot.machineName}</span> | 
                            User: <span className="text-gray-300 font-semibold">{selectedShot.windowsUser}</span> | 
                            Thời gian: <span className="text-amber-300 font-mono">{formatDate(selectedShot.capturedAt)}</span>
                          </p>
                        </div>
                        <span className="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full font-bold text-xs">
                          ● Hiển Thị Mới Nhất
                        </span>
                      </div>

                      <div className="mt-4 rounded-xl overflow-hidden border border-gray-800 bg-black/80 flex items-center justify-center min-h-[380px]">
                        <img 
                          src={formatImageSrc(selectedShot.imageBase64)} 
                          alt="Full Screenshot" 
                          className="max-h-[500px] w-auto object-contain rounded-lg shadow-2xl"
                        />
                      </div>
                    </div>
                  ) : (
                    <div className="text-center py-20 space-y-3 text-gray-500">
                      <div className="text-4xl">🖼️</div>
                      <p className="text-sm font-semibold">Chưa chọn ảnh nào để xem.</p>
                    </div>
                  )}
                </div>

                {/* 2-Way Chat Stream Card */}
                <div className="glass-card p-5 rounded-2xl border border-gray-800 space-y-4">
                  <h3 className="text-xs font-bold text-amber-300 uppercase tracking-wider flex items-center space-x-2">
                    <span>💬 KHUNG CHAT REALTIME 2 CHIỀU (NGƯỜI DÙNG BẤM ` ĐỂ TRẢ LỜI)</span>
                  </h3>

                  {/* Quick Preset Buttons */}
                  <div className="grid grid-cols-5 gap-2 text-xs">
                    {['Gửi A', 'Gửi B', 'Gửi C', 'Gửi D', 'Gửi E'].map((opt) => (
                      <button 
                        key={opt}
                        onClick={() => handleSendSupportChat(`Đáp án: ${opt.replace('Gửi ', '')}`)}
                        className="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition active:scale-95">
                        {opt}
                      </button>
                    ))}
                  </div>

                  {/* Message Stream Window */}
                  <div className="bg-dark-900/90 border border-gray-800 rounded-xl p-4 h-48 overflow-y-auto space-y-3 text-xs">
                    {chatMessages.length === 0 ? (
                      <p className="text-gray-500 text-center py-10">Chưa có tin nhắn chat nào trong phiên này.</p>
                    ) : (
                      [...chatMessages].reverse().map((msg) => (
                        <div 
                          key={msg.id || Math.random()} 
                          className={`flex flex-col ${msg.sender === 'Support' ? 'items-end' : 'items-start'}`}>
                          <div className={`max-w-xs px-3.5 py-2 rounded-2xl shadow font-semibold ${msg.sender === 'Support' ? 'bg-brand-600 text-white rounded-br-none' : 'bg-gray-800 text-emerald-300 border border-gray-700 rounded-bl-none'}`}>
                            <span className="block text-[10px] opacity-75 mb-0.5">{msg.sender === 'Support' ? 'Support (Bạn):' : 'Khách Hàng:'}</span>
                            {msg.text}
                          </div>
                          <span className="text-[9px] text-gray-500 mt-1 font-mono">{formatDate(msg.timestamp)}</span>
                        </div>
                      ))
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Custom Message Input */}
                  <div className="flex items-center space-x-2 pt-1">
                    <input 
                      type="text"
                      placeholder="Gõ tin nhắn gửi người dùng (Ví dụ: Đáp án: A)..."
                      value={chatInputText}
                      onChange={e => setChatInputText(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') handleSendSupportChat(); }}
                      className="flex-1 bg-dark-900 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500"
                    />
                    <button 
                      onClick={() => handleSendSupportChat()}
                      className="px-5 py-2.5 bg-gradient-to-r from-brand-500 to-blue-600 hover:from-brand-600 hover:to-blue-700 text-white font-bold text-xs rounded-xl shadow transition">
                      Gửi Tin Nhắn ↵
                    </button>
                  </div>

                </div>

              </div>

            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
